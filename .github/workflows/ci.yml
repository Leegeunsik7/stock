name: CI

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]      # v3.39.0 식 태그 → 릴리스 패키징
  pull_request:

jobs:
  build-test:
    # net8.0-windows + WinForms/BlazorWebView → 반드시 Windows 러너 (ubuntu 불가)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore StockManager.sln

      - name: Build (Release, single-node)
        run: dotnet build StockManager.sln -c Release -m:1 --no-restore

      # v8.1.0 — WebOnly 빌드(네이티브 보안층 #if !WEBONLY 제외): Default 와 함께 0 Warning/0 Error 사수.
      - name: Build (WebOnly, 네이티브 디커플링)
        run: dotnet build StockManager/StockManager.csproj -c Release -p:WebOnly=true --no-restore

      # v8.1.0 Phase 83 — 인프라 결합도 래칫: 코어의 콘크리트 인프라 직결 결합이 baseline 초과 시 실패(비회귀 강제).
      - name: Infra coupling ratchet (Phase 83)
        shell: pwsh
        run: ./infra-scan.ps1

      - name: Test (전체 단위 테스트)
        run: dotnet test StockManager.Tests/StockManager.Tests.csproj -c Release --no-build

  release:
    # 태그(v*) 푸시에서만 실행 — Release EXE 패키징 + GitHub Release 업로드
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (Release)
        run: dotnet publish StockManager/StockManager.csproj -c Release -o publish --self-contained false

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "MS2E.StockSuite-${{ github.ref_name }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MS2E.StockSuite-${{ github.ref_name }}
          path: "MS2E.StockSuite-${{ github.ref_name }}.zip"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "MS2E.StockSuite-${{ github.ref_name }}.zip"
          generate_release_notes: true
