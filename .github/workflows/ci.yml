name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build-test:
    # net8.0-windows + WinForms → 반드시 Windows 러너 (ubuntu 불가)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore StockManager.sln

      - name: Build (Release)
        run: dotnet build StockManager.sln -c Release --no-restore

      - name: Test (105 cases)
        run: dotnet test StockManager.Tests/StockManager.Tests.csproj -c Release --no-build
