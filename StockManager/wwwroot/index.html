<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MS2-E Stock Suite</title>
  <base href="/" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="app.css" />
  <!-- v3.0: SortableJS(외부 DnD 라이브러리) 제거 — 위젯 정렬은 HTML5 네이티브 DnD + Blazor 이벤트로 대체 -->
</head>
<body>
  <div id="app"></div>
  <div id="blazor-error-ui" style="display:none">오류가 발생했습니다. <a href="" class="reload">새로고침</a></div>
  <script src="_framework/blazor.webview.js" autostart="false"></script>
  <script src="dashboard.js"></script>
  <!-- (선택) TradingView Lightweight Charts: 이 파일을 직접 배치하면 '고급차트'가 활성화됩니다.
       https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js → wwwroot/lib/ 에 저장.
       미배치여도(404) 앱은 정상 동작하며 기본 SVG 차트로 폴백합니다. -->
  <script src="lib/lightweight-charts.standalone.production.js"></script>
  <script src="tvchart.js"></script>
  <script>Blazor.start();</script>
</body>
</html>
